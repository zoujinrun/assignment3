<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dual-Track Interactive Melody Synthesizer</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 { margin-bottom: 5px; }
    p { color: #aaaaaa; margin-bottom: 20px; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      max-width: 600px;
    }
    button {
      background-color: #1ed760;
      color: #000;
      border: none;
      padding: 10px 16px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }
    button:hover { background-color: #1fdf64; transform: scale(1.05); }
    button.active { background-color: #ff5555; color: #fff; }
    canvas {
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Dual-Track Interactive Synthesizer</h1>
  <p>点击下方黑色画布开启/暂停双音轨合奏</p>

  <div class="controls">
    <button id="btn-track2">Toggle Bass Track (音轨 2: ON)</button>
    <button id="btn-reverse">Reverse Melody</button>
    <button id="btn-pitch">Pitch Up (+1 Octave)</button>
    <button id="btn-reset">Reset All</button>
  </div>

  <canvas id="synthCanvas" width="600" height="320"></canvas>

  <script>
    const canvas = document.getElementById('synthCanvas');
    const ctx = canvas.getContext('2d');

    let audioCtx = null;
    let isPlaying = false;
    let timerId = null;

    // 音轨 1 (主旋律 Lead: C4 - C5)
    const baseLeadNotes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
    // 音轨 2 (低音伴奏 Bass: C3 - C4，低一个八度)
    const baseBassNotes = [130.81, 146.83, 164.81, 174.61, 196.00, 220.00, 246.94, 261.63];

    let leadNotes = [...baseLeadNotes];
    let bassNotes = [...baseBassNotes];

    let currentStep = 0;
    let enableBassTrack = true; // 默认开启第二音轨
    let isReversed = false;
    let isPitchShifted = false;
    let statusText = "点击黑色画布区域开启播放";

    // 初始化 AudioContext
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 播放双音轨组合音符
    function playDualNotes(leadFreq, bassFreq) {
      if (!audioCtx) return;

      const now = audioCtx.currentTime;

      // 1. 主旋律音轨 (Sine 波，较清晰)
      const leadOsc = audioCtx.createOscillator();
      const leadGain = audioCtx.createGain();
      leadOsc.type = 'sine';
      leadOsc.frequency.setValueAtTime(leadFreq, now);
      leadGain.gain.setValueAtTime(0.25, now);
      leadGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
      leadOsc.connect(leadGain);
      leadGain.connect(audioCtx.destination);
      leadOsc.start(now);
      leadOsc.stop(now + 0.3);

      // 2. 副音轨/低音轨 (Triangle 三角波，带丰满的低音质感)
      if (enableBassTrack && bassFreq) {
        const bassOsc = audioCtx.createOscillator();
        const bassGain = audioCtx.createGain();
        bassOsc.type = 'triangle';
        bassOsc.frequency.setValueAtTime(bassFreq, now);
        bassGain.gain.setValueAtTime(0.35, now);
        bassGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
        bassOsc.connect(bassGain);
        bassGain.connect(audioCtx.destination);
        bassOsc.start(now);
        bassOsc.stop(now + 0.38);
      }
    }

    // Canvas 画面绘制
    function draw() {
      ctx.fillStyle = '#181818';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 状态与指示信息
      ctx.fillStyle = '#ffffff';
      ctx.font = '14px sans-serif';
      ctx.fillText(`状态: ${statusText}`, 20, 30);
      ctx.fillText(`Track 1 (Lead): ON  |  Track 2 (Bass): ${enableBassTrack ? 'ON' : 'OFF'}`, 20, 52);

      const stepWidth = canvas.width / leadNotes.length;

      // 绘制两个音轨的节点图
      for (let i = 0; i < leadNotes.length; i++) {
        const x = i * stepWidth + stepWidth / 2;

        // 音轨 1 Y坐标 (上方)
        const leadY = canvas.height - (leadNotes[i] / 1100) * 140 - 120;
        // 音轨 2 Y坐标 (下方)
        const bassY = canvas.height - (bassNotes[i] / 600) * 80 - 30;

        // 绘制连接两条音轨的垂直和声线
        if (enableBassTrack) {
          ctx.strokeStyle = (isPlaying && i === currentStep) ? 'rgba(255, 85, 85, 0.6)' : 'rgba(255, 255, 255, 0.15)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x, leadY);
          ctx.lineTo(x, bassY);
          ctx.stroke();
        }

        // 绘制音轨 1 (主旋律 - 蓝红点)
        ctx.beginPath();
        if (isPlaying && i === currentStep) {
          ctx.arc(x, leadY, 12, 0, Math.PI * 2);
          ctx.fillStyle = '#ff5555';
        } else {
          ctx.arc(x, leadY, 7, 0, Math.PI * 2);
          ctx.fillStyle = '#5588ff';
        }
        ctx.fill();

        // 绘制音轨 2 (低音轨 - 黄方块/方圈)
        if (enableBassTrack) {
          ctx.beginPath();
          if (isPlaying && i === currentStep) {
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(x - 9, bassY - 9, 18, 18);
          } else {
            ctx.fillStyle = '#88aa33';
            ctx.fillRect(x - 6, bassY - 6, 12, 12);
          }
        }
      }

      requestAnimationFrame(draw);
    }

    // 点击画布播放 / 停止
    canvas.addEventListener('click', () => {
      initAudio();
      isPlaying = !isPlaying;

      if (isPlaying) {
        statusText = "双音轨合奏播放中...";
        playDualNotes(leadNotes[currentStep], bassNotes[currentStep]);
        if (timerId) clearInterval(timerId);
        timerId = setInterval(() => {
          currentStep = (currentStep + 1) % leadNotes.length;
          playDualNotes(leadNotes[currentStep], bassNotes[currentStep]);
        }, 340);
      } else {
        statusText = "暂停播放。点击画布继续。";
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }
    });

    // 独立控制音轨 2 的开关
    const track2Btn = document.getElementById('btn-track2');
    track2Btn.addEventListener('click', () => {
      enableBassTrack = !enableBassTrack;
      track2Btn.textContent = `Toggle Bass Track (音轨 2: ${enableBassTrack ? 'ON' : 'OFF'})`;
      track2Btn.classList.toggle('active', !enableBassTrack);
      statusText = enableBassTrack ? "已开启低音伴奏音轨" : "已关闭低音伴奏音轨";
    });

    // 旋律反向
    document.getElementById('btn-reverse').addEventListener('click', () => {
      isReversed = !isReversed;
      leadNotes.reverse();
      bassNotes.reverse();
      statusText = isReversed ? "双音轨已反向播放" : "恢复正常顺序";
    });

    // 升八度
    document.getElementById('btn-pitch').addEventListener('click', () => {
      isPitchShifted = !isPitchShifted;
      const factor = isPitchShifted ? 2 : 1;
      leadNotes = baseLeadNotes.map(f => f * factor);
      bassNotes = baseBassNotes.map(f => f * factor);
      if (isReversed) {
        leadNotes.reverse();
        bassNotes.reverse();
      }
      statusText = isPitchShifted ? "音调升高 1 八度" : "音调恢复默认";
    });

    // 重置
    document.getElementById('btn-reset').addEventListener('click', () => {
      isReversed = false;
      isPitchShifted = false;
      enableBassTrack = true;
      leadNotes = [...baseLeadNotes];
      bassNotes = [...baseBassNotes];
      track2Btn.textContent = "Toggle Bass Track (音轨 2: ON)";
      track2Btn.classList.remove('active');
      statusText = "已重置所有音轨与设置";
    });

    draw();
  </script>
</body>
</html>
