<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triple-Track Visual Synthesizer</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 { margin-bottom: 5px; }
    p { color: #aaaaaa; margin-bottom: 20px; text-align: center; max-width: 550px;}
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      max-width: 650px;
    }
    button {
      background-color: #1ed760;
      color: #000;
      border: none;
      padding: 8px 14px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }
    button:hover { background-color: #1fdf64; transform: scale(1.05); }
    button.off { background-color: #444444; color: #888888; }
    canvas {
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Triple-Track Visual Synthesizer</h1>
  <p>点击黑色画布开启声音。支持自由切换 Track 1、2、3 音轨与视听协统。</p>

  <div class="controls">
    <button id="btn-t1">Track 1 Lead: ON</button>
    <button id="btn-t2">Track 2 Bass: ON</button>
    <button id="btn-t3">Track 3 Arp: ON</button>
    <button id="btn-reverse">Reverse</button>
    <button id="btn-pitch">Pitch Up (+1 Octave)</button>
    <button id="btn-reset">Reset All</button>
  </div>

  <canvas id="synthCanvas" width="620" height="360"></canvas>

  <script>
    const canvas = document.getElementById('synthCanvas');
    const ctx = canvas.getContext('2d');

    let isPlaying = false;
    let timerId = null;

    // 音轨 1: 主旋律 Lead (Sine 正弦波)
    const baseLeadNotes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
    // 音轨 2: 低音伴奏 Bass (Triangle 三角波/方波)
    const baseBassNotes = [130.81, 146.83, 164.81, 174.61, 196.00, 220.00, 246.94, 261.63];
    // 音轨 3: 电子和声 Arp (Sawtooth 锯齿波)
    const baseArpNotes  = [329.63, 369.99, 415.30, 440.00, 493.88, 554.37, 622.25, 659.25];

    let leadNotes = [...baseLeadNotes];
    let bassNotes = [...baseBassNotes];
    let arpNotes  = [...baseArpNotes];

    let currentStep = 0;
    let enableT1 = true;
    let enableT2 = true;
    let enableT3 = true;

    let isReversed = false;
    let isPitchShifted = false;
    let statusText = "点击黑色画布区域开启播放";
    let animationTime = 0;

    // 动态生成包含多音轨波形混合的 WAV 音频 Data URI（不依赖 AudioContext，绝对兼容）
    function generateTripleWavUrl(f1, f2, f3, duration = 0.25) {
      const sampleRate = 8000;
      const numSamples = Math.floor(sampleRate * duration);
      const data = new Uint8Array(44 + numSamples);

      const writeString = (offset, str) => {
        for (let i = 0; i < str.length; i++) data[offset + i] = str.charCodeAt(i);
      };
      const writeUint32 = (offset, val) => {
        data[offset] = val & 0xff;
        data[offset + 1] = (val >> 8) & 0xff;
        data[offset + 2] = (val >> 16) & 0xff;
        data[offset + 3] = (val >> 24) & 0xff;
      };
      const writeUint16 = (offset, val) => {
        data[offset] = val & 0xff;
        data[offset + 1] = (val >> 8) & 0xff;
      };

      writeString(0, 'RIFF');
      writeUint32(4, 36 + numSamples);
      writeString(8, 'WAVEfmt ');
      writeUint32(16, 16);
      writeUint16(20, 1); // PCM
      writeUint16(22, 1); // Mono
      writeUint32(24, sampleRate);
      writeUint32(28, sampleRate);
      writeUint16(32, 1);
      writeUint16(34, 8); // 8-bit
      writeString(36, 'data');
      writeUint32(40, numSamples);

      for (let i = 0; i < numSamples; i++) {
        const t = i / sampleRate;
        let mixedVal = 0;
        let activeCount = 0;

        // 音轨 1: Sine 柔和正弦波
        if (enableT1 && f1) {
          mixedVal += Math.sin(2 * Math.PI * f1 * t) * 0.4;
          activeCount++;
        }

        // 音轨 2: Triangle 低音三角波
        if (enableT2 && f2) {
          const tri = 2 * Math.abs(2 * (t * f2 - Math.floor(t * f2 + 0.5))) - 1;
          mixedVal += tri * 0.5;
          activeCount++;
        }

        // 音轨 3: Sawtooth 锯齿波
        if (enableT3 && f3) {
          const saw = 2 * (t * f3 - Math.floor(t * f3 + 0.5));
          mixedVal += saw * 0.25;
          activeCount++;
        }

        if (activeCount > 0) mixedVal /= Math.sqrt(activeCount); // 音量混音归一化，防止爆音

        // 加上衰减包络线，避免边缘噪音
        const env = Math.exp(-t * 6);
        mixedVal *= env;

        const sample = Math.floor(Math.max(-1, Math.min(1, mixedVal)) * 127.5 + 127.5);
        data[44 + i] = sample;
      }

      let binary = '';
      for (let i = 0; i < data.length; i++) {
        binary += String.fromCharCode(data[i]);
      }
      return 'data:audio/wav;base64,' + btoa(binary);
    }

    // 播放音符
    function playStepSound() {
      const f1 = leadNotes[currentStep];
      const f2 = bassNotes[currentStep];
      const f3 = arpNotes[currentStep];

      const wavUrl = generateTripleWavUrl(f1, f2, f3);
      const audio = new Audio(wavUrl);
      audio.play().catch(e => console.log("Audio play prevented:", e));
    }

    // Canvas 渲染引擎
    function draw() {
      animationTime += 1;

      ctx.fillStyle = '#181818';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ffffff';
      ctx.font = '14px sans-serif';
      ctx.fillText(`状态: ${statusText}`, 20, 28);
      ctx.fillText(`Active Tracks: [T1 Lead: ${enableT1?'ON':'OFF'}] [T2 Bass: ${enableT2?'ON':'OFF'}] [T3 Arp: ${enableT3?'ON':'OFF'}]`, 20, 50);

      const stepWidth = canvas.width / leadNotes.length;

      for (let i = 0; i < leadNotes.length; i++) {
        const x = i * stepWidth + stepWidth / 2;
        const baseAmp = (isPlaying && i === currentStep) ? 14 : 5;

        // T1: 高音旋律 (快速颤动)
        const fFactor1 = leadNotes[i] / 523.25;
        const y1 = canvas.height - (leadNotes[i] / 1100) * 110 - 180 + Math.sin(animationTime * 0.2 * fFactor1) * baseAmp;
        const x1 = x + Math.cos(animationTime * 0.2 * fFactor1) * (baseAmp / 3);

        // T3: 电子和声 (左右晃动)
        const fFactor3 = arpNotes[i] / 659.25;
        const y3 = canvas.height - (arpNotes[i] / 1100) * 110 - 100 + Math.sin(animationTime * 0.12 * fFactor3) * baseAmp;
        const x3 = x + Math.sin(animationTime * 0.15 * fFactor3) * (baseAmp / 2);

        // T2: 低音轨 (慢速起伏)
        const fFactor2 = bassNotes[i] / 261.63;
        const y2 = canvas.height - (bassNotes[i] / 600) * 60 - 30 + Math.sin(animationTime * 0.05 * fFactor2) * baseAmp;

        // 绘制垂直和声线
        ctx.strokeStyle = (isPlaying && i === currentStep) ? 'rgba(255, 255, 255, 0.5)' : 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        if (enableT1) ctx.lineTo(x1, y1);
        if (enableT3) ctx.lineTo(x3, y3);
        if (enableT2) ctx.lineTo(x, y2);
        ctx.stroke();

        // 1. Track 1 (蓝色/红色 蓝圈)
        if (enableT1) {
          ctx.beginPath();
          ctx.arc(x1, y1, (isPlaying && i === currentStep) ? 11 : 6, 0, Math.PI * 2);
          ctx.fillStyle = (isPlaying && i === currentStep) ? '#ff5555' : '#5588ff';
          ctx.fill();
        }

        // 2. Track 3 (紫色 菱形)
        if (enableT3) {
          ctx.beginPath();
          const r = (isPlaying && i === currentStep) ? 9 : 5;
          ctx.moveTo(x3, y3 - r);
          ctx.lineTo(x3 + r, y3);
          ctx.lineTo(x3, y3 + r);
          ctx.lineTo(x3 - r, y3);
          ctx.closePath();
          ctx.fillStyle = (isPlaying && i === currentStep) ? '#ff00ff' : '#aa55ff';
          ctx.fill();
        }

        // 3. Track 2 (黄绿/黄色 方块)
        if (enableT2) {
          ctx.beginPath();
          const s = (isPlaying && i === currentStep) ? 16 : 10;
          ctx.fillStyle = (isPlaying && i === currentStep) ? '#ffcc00' : '#88aa33';
          ctx.fillRect(x - s/2, y2 - s/2, s, s);
        }
      }

      requestAnimationFrame(draw);
    }

    // 点击画布控制播放/停止
    canvas.addEventListener('click', () => {
      isPlaying = !isPlaying;

      if (isPlaying) {
        statusText = "三音轨复调演奏中...";
        playStepSound();
        if (timerId) clearInterval(timerId);
        timerId = setInterval(() => {
          currentStep = (currentStep + 1) % leadNotes.length;
          playStepSound();
        }, 340);
      } else {
        statusText = "已暂停播放。点击画布继续。";
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }
    });

    // 控制音轨按钮
    const btnT1 = document.getElementById('btn-t1');
    btnT1.addEventListener('click', () => {
      enableT1 = !enableT1;
      btnT1.textContent = `Track 1 Lead: ${enableT1 ? 'ON' : 'OFF'}`;
      btnT1.classList.toggle('off', !enableT1);
    });

    const btnT2 = document.getElementById('btn-t2');
    btnT2.addEventListener('click', () => {
      enableT2 = !enableT2;
      btnT2.textContent = `Track 2 Bass: ${enableT2 ? 'ON' : 'OFF'}`;
      btnT2.classList.toggle('off', !enableT2);
    });

    const btnT3 = document.getElementById('btn-t3');
    btnT3.addEventListener('click', () => {
      enableT3 = !enableT3;
      btnT3.textContent = `Track 3 Arp: ${enableT3 ? 'ON' : 'OFF'}`;
      btnT3.classList.toggle('off', !enableT3);
    });

    // 旋律反向
    document.getElementById('btn-reverse').addEventListener('click', () => {
      isReversed = !isReversed;
      leadNotes.reverse();
      bassNotes.reverse();
      arpNotes.reverse();
      statusText = isReversed ? "三音轨已反向" : "恢复正常顺序";
    });

    // 升八度
    document.getElementById('btn-pitch').addEventListener('click', () => {
      isPitchShifted = !isPitchShifted;
      const factor = isPitchShifted ? 2 : 1;
      leadNotes = baseLeadNotes.map(f => f * factor);
      bassNotes = baseBassNotes.map(f => f * factor);
      arpNotes  = baseArpNotes.map(f => f * factor);
      if (isReversed) {
        leadNotes.reverse();
        bassNotes.reverse();
        arpNotes.reverse();
      }
      statusText = isPitchShifted ? "升高 1 个八度" : "恢复默认音调";
    });

    // 重置
    document.getElementById('btn-reset').addEventListener('click', () => {
      isReversed = false;
      isPitchShifted = false;
      enableT1 = true;
      enableT2 = true;
      enableT3 = true;
      leadNotes = [...baseLeadNotes];
      bassNotes = [...baseBassNotes];
      arpNotes  = [...baseArpNotes];

      btnT1.textContent = "Track 1 Lead: ON"; btnT1.classList.remove('off');
      btnT2.textContent = "Track 2 Bass: ON"; btnT2.classList.remove('off');
      btnT3.textContent = "Track 3 Arp: ON";  btnT3.classList.remove('off');
      statusText = "重置所有设置";
    });

    draw();
  </script>
</body>
</html>
